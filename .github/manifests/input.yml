# yaml-language-server: $schema=./input.schema.json
description: |
  Copy new ACCESS-OM3 rof remap weights for the 8km, 25km and 100km land masks to prerelease.
  Generated with om3-scripts main (5e80312), which restricts Ob and Back river spreading to a
  bearing (https://github.com/ACCESS-NRI/om3-scripts/pull/178).
  Original file locations are:
  - /g/data/tm70/as2285/making_inputs/model-config-inputs-staging/cmeps_remap_weights_8km/2026.10.26
  - /g/data/tm70/as2285/making_inputs/model-config-inputs-staging/cmeps_remap_weights_25km/2026.10.26
  - /g/data/tm70/as2285/making_inputs/model-config-inputs-staging/cmeps_remap_weights_100km/2026.10.26
target: Gadi
type: Prerelease
cold-storage: true
overwrite: false
inputs:
  # Note that the source is an absolute path accessible to the service user
  # Note that the target is a relative path to the given targets inputs directory,
  # eg. Gadi Prerelease is /g/data/vk83/prerelease/configurations/inputs
  /g/data/tm70/as2285/making_inputs/model-config-inputs-staging/cmeps_remap_weights_8km/2026.10.26: access-om3/cmeps/remap_weights/global.8km/
  /g/data/tm70/as2285/making_inputs/model-config-inputs-staging/cmeps_remap_weights_25km/2026.10.26: access-om3/cmeps/remap_weights/global.25km/
  /g/data/tm70/as2285/making_inputs/model-config-inputs-staging/cmeps_remap_weights_100km/2026.10.26: access-om3/cmeps/remap_weights/global.100km/
