  /g/data/tm70/sw6175/development/esm1p6/restartfiles/2026.08.04-scen7-h/restart_metadata.yaml: access-esm1p6/modern/scen7-h/restart/2026.08.04/
  /g/data/tm70/sw6175/development/esm1p6/restartfiles/2026.08.04-scen7-vl/restart_metadata.yaml: access-esm1p6/modern/scen7-vl/restart/2026.08.04/
  /g/data/tm70/sw6175/development/esm1p6/restartfiles/2026.08.04-esm-scen7-h/restart_metadata.yaml: access-esm1p6/modern/esm-scen7-h/restart/2026.08.04/
  /g/data/tm70/sw6175/development/esm1p6/restartfiles/2026.08.04-esm-scen7-vl/restart_metadata.yaml: access-esm1p6/modern/esm-scen7-vl/restart/2026.08.04/
