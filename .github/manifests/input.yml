description: |
  Regenerated iceberg runoff (rofi) spreading pattern for the panan 4km + ice shelf
  configuration, using the Bear Ridge sea ice topography
  (access-om3/panan-isf.4km/2026.09.07/topog_seaice.nc) so that no runoff falls on
  the masked Bear Ridge cells.
  See https://github.com/ACCESS-NRI/access-om3-configs/issues/1479
target: Gadi
type: Prerelease
cold-storage: true
overwrite: false
inputs:
  /g/data/tm70/ds0092/model/inputs/access-om3/panan+isf/bear_ridge/2026.11.13: access-om3/cmeps/rofi_pattern/panan-isf.4km/
