# yaml-language-server: $schema=./input.schema.json
description: |
  Promote existing, tested ACCESS-OM3 100 km MOM6-CICE6-WW3 (MCW) inputs
  from VK83 Prerelease to Release for the first MCW beta release.
  Preserve the versioned paths and include the available input README files.
  The JRA55-do runoff mesh is already in Release and is excluded.
target: Gadi
type: Release
cold-storage: true
overwrite: false
inputs:
  # Absolute Prerelease files map to directories relative to
  # /g/data/vk83/configurations/inputs/. No directory copies or overwrites.
  /g/data/vk83/prerelease/configurations/inputs/access-om3/share/meshes/global.100km/2026.10.13/access-om3-100km-ESMFmesh.nc: access-om3/share/meshes/global.100km/2026.10.13/
