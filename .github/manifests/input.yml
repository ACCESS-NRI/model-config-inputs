# yaml-language-server: $schema=./input.schema.json
description: |
  Copy the preliminary ESM1.6 esm-scen7-h and esm-scen7-vl CO2 emissions into the prerelease area for testing
target: Gadi
type: Prerelease
cold-storage: true
overwrite: false
inputs:
  # Note that the source is an absolute path accessible to the service user
  # Note that the target is a relative path to the given targets inputs directory,
  # eg. Gadi Prerelease is /g/data/vk83/prerelease/configurations/inputs
  /g/data/tm70/sw6175/development/esm1p6/inputfiles/scen7/esm-h/: access-esm1p6/modern/esm-scen7-h/atmosphere/forcing/global.N96/2026.08.14/
  /g/data/tm70/sw6175/development/esm1p6/inputfiles/scen7/esm-hl/: access-esm1p6/modern/esm-scen7-hl/atmosphere/forcing/global.N96/2026.08.14/
  /g/data/tm70/sw6175/development/esm1p6/inputfiles/scen7/esm-m/: access-esm1p6/modern/esm-scen7-m/atmosphere/forcing/global.N96/2026.08.14/
  /g/data/tm70/sw6175/development/esm1p6/inputfiles/scen7/esm-vl/: access-esm1p6/modern/esm-scen7-vl/atmosphere/forcing/global.N96/2026.08.14/
  
