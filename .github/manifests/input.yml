# yaml-language-server: $schema=./input.schema.json
description: |
  Bring the AM3 inputs into Release: UKCA emissions (n96e), aerosol emissions for aeroprog (n96e), n512e ancillaries and restart files for n96e and n512e
target: Gadi
type: Release
cold-storage: true
overwrite: false
inputs:
  # Note that the source is an absolute path accessible to the service user
  # Note that the target is a relative path to the given targets inputs directory,
  # eg. Gadi Prerelease is /g/data/vk83/prerelease/configurations/inputs
  /g/data/vk83/prerelease/configurations/inputs/access-am3/ukca/.: access-am3/ukca/
  /g/data/vk83/prerelease/configurations/inputs/access-am3/restart/.: access-am3/restart/
  /g/data/vk83/prerelease/configurations/inputs/access-am3/land/.: access-am3/land/
  /g/data/vk83/prerelease/configurations/inputs/access-am3/atmosphere/aerosols/.: access-am3/atmosphere/aerosols/
  /g/data/vk83/prerelease/configurations/inputs/access-am3/atmosphere/ocean/.: access-am3/atmosphere/ocean/
  /g/data/vk83/prerelease/configurations/inputs/access-am3/atmosphere/orography/.: access-am3/atmosphere/orography/
  /g/data/vk83/prerelease/configurations/inputs/access-am3/README.md: access-am3/
