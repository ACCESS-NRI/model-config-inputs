# yaml-language-server: $schema=./input.schema.json
description: |
  Promote the ACCESS-OM3 100 km rof remap weights (2026.10.13) from VK83
  Prerelease to Release, so the first MCW 100 km beta release
  (dev-MCW_100km_era_iaf) can match the shared run MCW_100km_era_iaf-test1-961264ad
  (https://github.com/ACCESS-NRI/access-om3-configs/issues/1881).
target: Gadi
type: Release
cold-storage: true
overwrite: false
inputs:
  # Absolute Prerelease files map to directories relative to
  # /g/data/vk83/configurations/inputs/.
  /g/data/vk83/prerelease/configurations/inputs/access-om3/cmeps/remap_weights/global.100km/2026.10.13/access-om3-100km-rof-remap-weights.nc: access-om3/cmeps/remap_weights/global.100km/2026.10.13/
  /g/data/vk83/prerelease/configurations/inputs/access-om3/cmeps/remap_weights/global.100km/2026.10.13/access-om3-100km-rof-remap-weights.README.md: access-om3/cmeps/remap_weights/global.100km/2026.10.13/
