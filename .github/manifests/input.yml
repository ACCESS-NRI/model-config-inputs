# yaml-language-server: $schema=./input.schema.json
description: |
  Brings in input files to prerelease for the ACCESS-rOM3 MOM6 Tas configuration for use in a rOM3 template and for testing. 
target: Gadi
type: Prerelease
cold-storage: true
overwrite: false
inputs:
  # Note that the source is an absolute path accessible to the service user
  # Note that the target is a relative path to the given targets inputs directory,
  # eg. Gadi Prerelease is /g/data/vk83/prerelease/configurations/inputs
        /g/data/tm70/hm6113/rom3-inputdirs/template2upload/.: access-rom3/regional_template/2026.08.14/

